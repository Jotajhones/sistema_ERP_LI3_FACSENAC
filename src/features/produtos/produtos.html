<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Produto - ERP</title>

    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../header/header.css">
    <link rel="stylesheet" href="./produtos.css">
    <link rel="stylesheet" href="./tableProdutos.css">
</head>

<body>

    <div id="app-header"></div>

    <main class="erp-container">
        <div class="form-container">
            <h2 style="margin-bottom: 1.5rem;">Cadastrar Novo Produto</h2>

            <form id="formProduto">
                <div class="form-group">
                    <label for="nome">Nome do Produto *</label>
                    <input type="text" id="nome" class="form-control" placeholder="Ex: Cimento CP II">
                    <div id="erroNome" class="error-message">O nome não pode estar vazio.</div>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="sku">Código SKU *</label>
                        <input type="text" id="sku" class="form-control" placeholder="Ex: CIM-001">
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label for="unidade_medida">Unidade de Medida *</label>
                        <select id="unidade_medida" class="form-control">
                            <option value="UN">Unidade (UN)</option>
                            <option value="M3">Metro Cúbico (M³)</option>
                            <option value="KG">Quilograma (KG)</option>
                            <option value="SC">Saco (SC)</option>
                            <option value="L">Litro (L)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="valor_venda">Valor de Venda (R$) *</label>
                    <input type="number" id="valor_venda" class="form-control" step="0.01" placeholder="0.00">
                    <div id="erroValor" class="error-message">O valor não pode ser negativo.</div>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" class="form-control" rows="3"
                        placeholder="Detalhes opcionais..."></textarea>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 2rem;">
                    <button type="button" id="btnCancelar" class="btn-submit"
                        style="background-color: var(--color-text-muted);">Cancelar</button>
                    <button type="submit" id="btnSalvar" class="btn-submit" data-role="admin-only" disabled>Salvar Produto</button>
                </div>
            </form>
        </div>

        <div class="table-container" style="margin-top: 4rem;">
            <div class="action-bar" style="padding: 1.5rem 1.5rem 0 1.5rem; margin-bottom: 0;">
                <h3 style="color: var(--color-text-main);">Produtos Cadastrados</h3>
                <input type="text" id="searchInput" class="erp-input" placeholder="Buscar por nome ou SKU...">
            </div>

            <table class="erp-table">
                <thead>
                    <tr>
                        <th width="15%">SKU</th>
                        <th width="30%">Produto</th>
                        <th width="10%" class="text-center">UN</th>
                        <th width="10%" class="text-right">Estoque</th>
                        <th width="15%" class="text-right">Valor Venda</th>
                        <th width="10%" class="text-center">Status</th>
                        <th width="10%" class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaProdutosBody">
                    <tr>
                        <td colspan="7" class="text-center" style="padding: 2rem; color: var(--color-text-muted);">
                            Carregando produtos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../scripts/env.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
