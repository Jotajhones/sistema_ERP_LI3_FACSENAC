<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Construção - Acesso Restrito</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f2f2f2;
    font-family: Arial, sans-serif;
    color: #333333;
    padding: 16px;
  }

  .login-card {
    width: 100%;
    max-width: 350px;
    background-color: #ffffff;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    padding: 24px;
  }

  .login-card h1 {
    font-size: 20px;
    text-align: center;
    margin: 0 0 4px 0;
  }

  .login-card p {
    text-align: center;
    margin: 0 0 20px 0;
    color: #666666;
    font-size: 14px;
  }

  .campo {
    margin-bottom: 16px;
  }

  .campo label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .campo input {
    width: 100%;
    padding: 8px;
    border: 2px solid #cccccc;
    border-radius: 5px;
    font-size: 14px;
  }

  /* estado de campo validado com sucesso */
  .campo.valido input {
    border-color: green;
  }

  /* estado de campo com erro */
  .campo.invalido input {
    border-color: red;
  }

  .mensagem-campo {
    display: block;
    font-size: 12px;
    margin-top: 4px;
  }

  .campo.invalido .mensagem-campo {
    color: red;
  }

  .campo.valido .mensagem-campo {
    color: green;
  }

  .btn-entrar {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
    background-color: #d97706;
    color: #ffffff;
    font-size: 15px;
    cursor: pointer;
  }

  /* estado de carregando (aguardando resposta) */
  .btn-entrar.carregando {
    background-color: #999999;
    cursor: default;
  }

  .alerta {
    margin-top: 14px;
    padding: 10px;
    border-radius: 5px;
    font-size: 13px;
  }

  .alerta[hidden] {
    display: none;
  }

  .alerta-erro {
    background-color: #fdecea;
    color: #b71c1c;
  }

  .alerta-sucesso {
    background-color: #e8f5e9;
    color: #1b5e20;
  }

  /* celular pequeno */
  @media (max-width: 320px) {
    .login-card {
      padding: 16px;
    }
  }

  /* telas de desktop */
  @media (min-width: 1024px) {
    .login-card {
      max-width: 400px;
      padding: 32px;
    }
  }
</style>
</head>
<body>

  <div class="login-card">
    <h1>ERP Construção</h1>
    <p>Acesso Restrito</p>

    <form id="formLogin">
      <div class="campo" id="campoEmail">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com">
        <span class="mensagem-campo" id="mensagemEmail"></span>
      </div>

      <div class="campo" id="campoSenha">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="********">
        <span class="mensagem-campo" id="mensagemSenha"></span>
      </div>

      <button type="submit" class="btn-entrar" id="btnEntrar">ENTRAR</button>
    </form>

    <div class="alerta alerta-erro" id="alertaErro" hidden></div>
    <div class="alerta alerta-sucesso" id="alertaSucesso" hidden></div>
  </div>

</body>
</html>
